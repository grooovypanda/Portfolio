<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Shivangi Awasthi</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#1d1d1f; --ink-soft:#6e6e73; --accent:#0066cc; --accent-hover:#0077ed; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    color:var(--ink); background:#fff; min-height:100vh;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:22px;
    -webkit-font-smoothing:antialiased;
  }
  .eyebrow { font-size:19px; font-weight:600; color:var(--accent); margin-bottom:8px; }
  h1 { font-size:clamp(40px,7vw,72px); font-weight:600; letter-spacing:-0.015em; line-height:1.05; margin-bottom:14px; }
  p { font-size:clamp(19px,2.6vw,22px); color:var(--ink-soft); max-width:460px; margin:0 auto 28px; }
  a { color:var(--accent); text-decoration:none; font-size:19px; }
  a:hover { color:var(--accent-hover); text-decoration:underline; }
  a::after { content:" \203A"; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">Error 404</p>
    <h1>This page took a<br>different path.</h1>
    <p>The link may be broken, or the page may have moved.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
